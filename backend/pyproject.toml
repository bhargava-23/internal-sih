[project]
name = "aquasence-backend"
version = "0.1.0"
description = "AquaSence AI backend — simulation-driven smart irrigation prototype (SIH 2026)"
requires-python = ">=3.11"

dependencies = [
    # Web framework (TRD: FastAPI + Python)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Data validation (TRD: Pydantic v2)
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database (TRD: SQLite + SQLAlchemy 2.0)
    "sqlalchemy>=2.0.36",

    # HTTP client — used by Open-Meteo adapter
    "httpx>=0.27.0",

    # ML — Layer 2 residual model (TRD: XGBoost)
    "xgboost>=2.1.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",

    # Environment variable loading
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",  # async test client for FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
